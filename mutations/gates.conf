# --- The audit report belongs to the method whose icon opened it (U6) --------------------
# The scope is a FILTER value and never a base condition, which is what keeps it out of the
# security boundary: the base condition is `courseid = <context>` and stays that way, so nothing
# a filter carries reaches outside the course.
#
# Note WHICH WAY it fails, because this paragraph said the opposite first and the rest of the
# slice had to retract it: select::get_sql_filter() checks the submitted value against its own
# options list and returns ['', []] when it is absent, so a forged value produces NO filter and
# the report WIDENS to the whole course - the view its reader already holds
# enrol/apply:viewreports for. It fails open into something permitted, not closed.
#
# The three gates below hold the three ways the FILTER half can be wrong. The identity half is
# BZ, further down, with a preamble of its own.
#
# report.php's CALL to scope_to_method() is held by Behat, not here: it lives in a page script
# and every PHPUnit test calls the method directly, so a gate deleting that line would redden
# nothing. The scenario is "The applications report shows the method whose icon opened it".
BW_scope_lets_the_stored_value_win | classes/reportbuilder/local/systemreports/course_applications.php | bw_scope_lets_the_stored_value_win.pl
#   -> course_applications_test::test_the_url_method_wins_over_a_stored_one

BX_scope_discards_other_filters | classes/reportbuilder/local/systemreports/course_applications.php | bx_scope_discards_other_filters.pl
