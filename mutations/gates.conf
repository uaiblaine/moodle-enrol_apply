# Mutation spec for enrol_apply — run with `mdl mutate moodle-enrol_apply mutations/gates.conf`.
#
# Each line breaks ONE guard and names the test that must go red because of it. That
# pairing is the claim this file exists to keep executable: a guard whose mutation
# reddens nothing is held by no test, whatever its comment says.
#
# Run `--dry-run` first. It applies every pattern, prints the diff and restores without
# testing, which is how you see that a pattern still matches the line it was written for
# after the file has moved. A pattern that matches nothing is a hard error, not a pass.
#
#     tag | file relative to the repo | perl script relative to this file

