# Read the two new elements bare. An EMPTY element parses back as null, so this breaks the
# ORDINARY path - every undecided application - and not only archives predating the elements.
# It reddens the whole backup suite rather than one test, because the TypeError happens inside
# a restore step and leaves the backup temp tables behind for every later restore in the run.
O_no_older_archive_guard | backup/moodle2/restore_enrol_apply_plugin.class.php | o_no_older_archive_guard.pl
#   -> backup_test::test_an_archive_without_the_new_elements_still_restores (the rest is cascade)

# Stop writing the two columns into the archive at all. Same cascade as O and for the same
# reason: the properties are then absent on every restore, not only on the test that names them.
P_fields_not_backed_up | backup/moodle2/backup_enrol_apply_plugin.class.php  | p_fields_not_backed_up.pl
#   -> backup_test::test_the_decided_groups_and_role_survive_a_restore (the rest is cascade)

# --- The eligibility predicate on the write door (lib.php) -----------------------------
# Delete the guard entirely: submit_application() writes an enrolment for an applicant the
# cohort restriction, the enrolment window, the instance status and the new-applications
# flag all exclude. Every one of those lived in the presentation layer alone until it was
# added, so this is the mutation that restores the original defect.
Q_write_door_allow_apply | lib.php | q_write_door_allow_apply.pl
#   -> test_the_write_door_refuses_an_applicant_outside_the_cohort
#   -> test_the_write_door_refuses_an_instance_taking_no_new_applications

# Keep the guard but judge the CURRENT user instead of the applicant. Only the cohort
# clause reads a person, so only the cohort test can see this one - which is why that test
# puts the operator inside the cohort and the applicant outside it.
R_write_door_current_user | lib.php | r_write_door_current_user.pl
#   -> test_the_write_door_refuses_an_applicant_outside_the_cohort

