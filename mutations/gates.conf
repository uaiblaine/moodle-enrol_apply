# Mutation spec for enrol_apply — run with `mdl mutate moodle-enrol_apply mutations/gates.conf`.
#
# Each line breaks ONE guard and names the test that must go red because of it. That
# pairing is the claim this file exists to keep executable: a guard whose mutation
# reddens nothing is held by no test, whatever its comment says.
#
# Run `--dry-run` first. It applies every pattern, prints the diff and restores without
# testing, which is how you see that a pattern still matches the line it was written for
# after the file has moved. A pattern that matches nothing is a hard error, not a pass.
#
#     tag | file relative to the repo | perl script relative to this file

# --- The participants-page decision icon (lib.php) ------------------------------------
# Drop the status gate: the icon would sit on every row this plugin ever enrolled.
A_icon_status_gate     | lib.php                      | a_status_gate.pl
#   -> test_an_approved_application_is_not_offered_the_decision_icon
#   -> test_an_expired_enrolment_is_not_offered_the_decision_icon

# Drop the capability gate entirely.
B_icon_capability      | lib.php                      | b_capability.pl
#   -> test_the_icon_needs_the_deciding_capability_in_the_course
#   -> test_a_mentor_is_offered_no_icon_in_the_course

# Widen the gate to can_manage_application(), the alternative the docblock forbids
# because it would offer the icon to a mentor holding nothing in the course.
G_widen_gate_to_mentor | lib.php                      | g_widen_gate.pl
#   -> test_a_mentor_is_offered_no_icon_in_the_course

# Return only this plugin's action instead of appending to core's.
E_drops_core_actions   | lib.php                      | e_parent.pl
#   -> test_the_icon_is_added_to_cores_own_actions  (+ three control assertions)

# Point the icon at the instance queue instead of the one application.
F_icon_target          | lib.php                      | f_target.pl
#   -> test_a_pending_application_is_offered_the_decision_icon
#   -> test_the_page_the_icon_opens_admits_the_teacher_it_was_offered_to

