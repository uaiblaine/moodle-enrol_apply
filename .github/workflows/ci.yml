name: ci

# The push trigger is master-only, so one change is validated once. With a bare `push:`
# every commit on a feature branch ran the full pipeline AND opening its pull request ran
# it a second time over the identical tree - 22 jobs to validate one commit, measured on
# pull request #58. Every branch here reaches master through a pull request, so the
# pull_request trigger is the one that gates the work; the push trigger now covers the
# merge commit itself, which nothing else would.
#
# workflow_dispatch is the manual escape hatch: without it, a push whose commits
# carry a skip-ci marker leaves code unvalidated with no way to launch a run short
# of pushing another commit. It also covers the case this change creates - wanting a run
# on a branch before it is ready for review.
#
# CI is not the only gate: the plugin is mounted on the local m501/m502 stacks
# (moodle-dev/plugins.conf), so run `mdl ci moodle-enrol_apply` before pushing.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  # One reusable-workflow call per supported Moodle branch (version.php
  # $plugin->supported) — update these when the supported range changes, in the
  # same commit as the version.php change. The highest branch runs the full
  # PHP x DB matrix; older branches run one DB only. PHPUnit and Behat run on
  # every runtime leg.
  ci-502:
    name: Moodle 5.02
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_502_STABLE

  ci-501:
    name: Moodle 5.01
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_501_STABLE
      one-db-only: true
